<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>豆腐制作四步骤｜点击放入游戏</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,"Microsoft YaHei",sans-serif;
background:linear-gradient(135deg,#f5f2ff,#fff8ed);
color:#302a45
}

header{
background:#fff;
padding:16px 24px;
display:flex;
align-items:center;
gap:18px;
box-shadow:0 3px 15px #0001;
position:sticky;
top:0;
z-index:5
}

.logo{
font-weight:900;
color:#6547e8;
font-size:22px;
white-space:nowrap
}

.progress{
height:10px;
background:#ebe8f7;
border-radius:20px;
overflow:hidden;
flex:1
}

.bar{
height:100%;
width:0;
background:#6547e8;
transition:.3s
}

.score{
font-weight:900;
color:#6547e8;
white-space:nowrap
}

main{
max-width:1100px;
margin:auto;
padding:24px 18px 40px
}

.title{
text-align:center;
margin-bottom:18px
}

h1{
margin:0;
color:#4a398d;
font-size:clamp(27px,5vw,40px)
}

.subtitle{
color:#756d80;
margin-top:7px
}

.instructions{
background:#fff;
border-radius:18px;
padding:16px;
text-align:center;
box-shadow:0 5px 18px #0001;
margin-bottom:18px;
line-height:1.7
}

.instructions b{
color:#6547e8
}

.board{
background:#ffffffdf;
border-radius:26px;
padding:20px;
box-shadow:0 10px 30px #0002
}

.steps{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px
}

.slot{
min-height:245px;
border:3px dashed #cfc9df;
border-radius:20px;
background:#faf9ff;
padding:12px;
cursor:pointer;
transition:.2s
}

.slot:hover{
border-color:#9c8bf0;
background:#f5f2ff
}

.slot.selected-slot{
border-color:#6547e8;
background:#f0edff;
box-shadow:0 0 0 4px #6547e833
}

.slot.correct{
border-color:#39b66c;
background:#edfff3
}

.slot h2{
text-align:center;
font-size:18px;
color:#6547e8;
margin:3px 0 10px
}

.dropzone{
min-height:190px;
display:flex;
flex-direction:column;
gap:8px;
align-items:center;
justify-content:center
}

.hint{
color:#aaa3b3;
text-align:center;
font-size:14px
}

.placed{
width:100%;
padding:7px;
border-radius:12px;
background:#fff;
border:2px solid #e7e2f0;
text-align:center;
font-weight:800
}

.placed.photo{
height:115px;
overflow:hidden;
padding:0
}

.placed.photo img{
width:100%;
height:100%;
object-fit:cover;
border-radius:10px
}

.placed.word{
font-size:17px
}

.placed.good{
border-color:#39b66c;
background:#edfff3
}

.poolTitle{
text-align:center;
margin:24px 0 12px;
color:#4a398d;
font-size:20px;
font-weight:900
}

.pool{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:13px
}

.wordTitle{
margin-top:20px
}

.wordTitle+.pool .card{
min-height:58px;
display:flex;
align-items:center;
justify-content:center
}

.card{
background:#fff;
border:2px solid #e2deec;
border-radius:18px;
padding:10px;
cursor:pointer;
user-select:none;
box-shadow:0 4px 12px #0002;
transition:.18s;
-webkit-user-select:none;
-webkit-touch-callout:none
}

.card:hover{
transform:translateY(-3px);
border-color:#9c8bf0
}

.card.selected{
border-color:#6547e8;
background:#f0edff;
transform:translateY(-3px);
box-shadow:0 0 0 3px #6547e833
}

.card.used{
opacity:.3;
pointer-events:none
}

.pic{
height:120px;
overflow:hidden;
border-radius:12px;
background:#eee
}

.pic img{
width:100%;
height:100%;
object-fit:cover
}

.word{
font-weight:900;
text-align:center;
padding:9px 4px;
font-size:17px
}

.message{
min-height:35px;
text-align:center;
font-size:20px;
font-weight:900;
margin-top:18px
}

.success{
color:#178046
}

.error{
color:#c43b3b
}

.bottom{
text-align:center;
margin-top:18px
}

button{
border:0;
background:#6547e8;
color:#fff;
border-radius:14px;
padding:11px 18px;
font-weight:900;
cursor:pointer;
font-size:16px
}

.note{
font-size:12px;
color:#81788b;
text-align:center;
margin-top:12px
}

@media(max-width:800px){

.steps{
grid-template-columns:repeat(2,1fr)
}

.pool{
grid-template-columns:repeat(2,1fr)
}

}

@media(max-width:500px){

.steps{
grid-template-columns:1fr
}

.pool{
grid-template-columns:repeat(2,1fr)
}

header{
flex-wrap:wrap
}

.progress{
order:3;
flex-basis:100%
}

}
</style>
</head>

<body>

<header>

<div class="logo">⚡ TOFU MATCH</div>

<div class="progress">
<div id="bar" class="bar"></div>
</div>

<div class="score">
⭐ <span id="score">0</span>/8
</div>

</header>

<main>

<div class="title">

<h1>🥣 豆腐制作四步骤</h1>

<div class="subtitle">
真实照片版 · 点击放入！
</div>

</div>

<div class="instructions">

<b>🎮 玩法：</b>

先点击一张图片或一个词语，
再点击上方正确的步骤格子。

<br>

图片和词语都使用相同的操作方式。

<br>

📱 手机直接点击即可，不需要拖动！

<br>

每一步要放入
<strong>1张照片＋1个词语</strong>。✨

</div>

<div class="board">

<div id="steps" class="steps"></div>


<div class="poolTitle">
🖼️ 点击图片 → 再点击步骤格
</div>

<div id="photoPool" class="pool"></div>


<div class="poolTitle wordTitle">
📝 点击词语 → 再点击步骤格
</div>

<div id="wordPool" class="pool"></div>


<div id="message" class="message"></div>


<div class="bottom">

<button onclick="resetGame()">
🔄 重新开始
</button>

</div>


<div class="note">
照片来自公开网页资料；游戏需要联网才能显示网上照片。
</div>

</div>

</main>

<script>

const data=[

{
id:"s1",
title:"第 1 步",
word:"浸泡黄豆",
img:"https://i0.wp.com/simpleveganizer.com/wp-content/uploads/2023/04/Soaking-the-soybeans-after.jpg?ssl=1&w=1440"
},

{
id:"s2",
title:"第 2 步",
word:"磨成豆浆",
img:"https://pic5.40017.cn/01/001/34/53/rBLkBls0yeuAPmAnAALIs8JoTEk670_680x_00.jpg"
},

{
id:"s3",
title:"第 3 步",
word:"煮沸过滤",
img:"https://cdn.shopify.com/s/files/1/0234/7849/files/IMG_9588.jpg?v=1509292258"
},

{
id:"s4",
title:"第 4 步",
word:"凝固压制",
img:"https://tokyo-kitchen.icook.network/uploads/step/cover/245410/ea84e2e846ae3d55.jpg"
}

];


let score=0;

let selectedItem=null;

let selectedType=null;

let placedPhotos={};

let placedWords={};


function shuffle(array){

return [...array].sort(function(){

return Math.random()-0.5;

});

}


function render(){

const steps=document.getElementById("steps");

const photoPool=document.getElementById("photoPool");

const wordPool=document.getElementById("wordPool");


steps.innerHTML="";

photoPool.innerHTML="";

wordPool.innerHTML="";


/* 创建上面的步骤格 */

data.forEach(function(item){

const slot=document.createElement("div");

slot.className="slot";

slot.id=item.id;


slot.innerHTML=

"<h2>"+item.title+"</h2>"+

"<div class='dropzone'>"+

"<div class='hint'>点击图片或词语，再点击这里</div>"+

"</div>";


slot.onclick=function(){

putIntoSlot(item.id);

};


steps.appendChild(slot);

});


/* 创建图片 */

shuffle(data).forEach(function(item){

const card=document.createElement("div");

card.className="card";

card.dataset.id=item.id;


card.innerHTML=

"<div class='pic'>"+

"<img src='"+item.img+"' alt='"+item.word+"'>"+

"</div>";


card.onclick=function(event){

event.stopPropagation();

selectItem(item.id,"photo",card);

};


photoPool.appendChild(card);

});


/* 创建词语 */

shuffle(data).forEach(function(item){

const card=document.createElement("div");

card.className="card";

card.dataset.id=item.id;


card.innerHTML=

"<div class='word'>"+

item.word+

"</div>";


card.onclick=function(event){

event.stopPropagation();

selectItem(item.id,"word",card);

};


wordPool.appendChild(card);

});


updateProgress();

}


/* 选择图片或词语 */

function selectItem(id,type,card){

/* 已经放进去就不能再选择 */

if(type==="photo" && placedPhotos[id]){

return;

}

if(type==="word" && placedWords[id]){

return;

}


/* 清除之前选择 */

document.querySelectorAll(".card")
.forEach(function(c){

c.classList.remove("selected");

});


/* 选择当前项目 */

card.classList.add("selected");

selectedItem=id;

selectedType=type;


const message=document.getElementById("message");

message.className="message";

message.innerHTML=
"👆 现在点击上面的正确步骤格子";


}


/* 点击步骤格 */

function putIntoSlot(slotId){

if(!selectedItem){

const message=document.getElementById("message");

message.className="message error";

message.innerHTML=
"👆 请先点击一张图片或一个词语！";

return;

}


const item=data.find(function(x){

return x.id===selectedItem;

});


const message=document.getElementById("message");


/* 检查是否已经有同类型内容 */

if(selectedType==="photo" && placedPhotos[slotId]){

message.className="message error";

message.innerHTML=
"⚠️ 这个步骤已经有图片了！";

return;

}


if(selectedType==="word" && placedWords[slotId]){

message.className="message error";

message.innerHTML=
"⚠️ 这个步骤已经有词语了！";

return;

}


/* 检查是否放对 */

if(slotId!==selectedItem){

message.className="message error";

message.innerHTML=
"❌ 放错了！请放到正确的步骤。";

document.getElementById(slotId)
.classList.add("selected-slot");


setTimeout(function(){

document.getElementById(slotId)
.classList.remove("selected-slot");

},700);

return;

}


/* 放置成功 */

if(selectedType==="photo"){

placedPhotos[slotId]=true;

}

else{

placedWords[slotId]=true;

}


score+=1;


/* 把内容放进格子 */

const slot=document.getElementById(slotId);

const zone=slot.querySelector(".dropzone");


/* 删除提示文字 */

const hint=zone.querySelector(".hint");

if(hint){

hint.remove();

}


/* 创建图片 */

if(selectedType==="photo"){

const placed=document.createElement("div");

placed.className="placed photo good";

placed.innerHTML=
"<img src='"+item.img+"' alt='"+item.word+"'>";

zone.appendChild(placed);

}


/* 创建词语 */

if(selectedType==="word"){

const placed=document.createElement("div");

placed.className="placed word good";

placed.textContent=item.word;

zone.appendChild(placed);

}


slot.classList.add("correct");


/* 让已经使用的卡片变淡 */

document.querySelectorAll(".card")
.forEach(function(card){

if(card.dataset.id===selectedItem){

card.classList.remove("selected");

card.classList.add("used");

}

});


message.className="message success";

message.innerHTML=
"🎉 放置正确！";


selectedItem=null;

selectedType=null;


updateProgress();


/* 全部完成 */

if(score===8){

setTimeout(function(){

message.innerHTML=
"🏆 恭喜你！全部完成！🎊";

},500);

}

}


/* 更新进度 */

function updateProgress(){

document.getElementById("score").textContent=score;

const percent=(score/8)*100;

document.getElementById("bar").style.width=
percent+"%";

}


/* 重新开始 */

function resetGame(){

score=0;

selectedItem=null;

selectedType=null;

placedPhotos={};

placedWords={};

document.getElementById("message").innerHTML="";

render();

}


/* 开始 */

render();

</script>

</body>
</html>
