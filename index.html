<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>豆腐制作四步骤｜点击配对游戏</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,"Microsoft YaHei",sans-serif;
background:linear-gradient(135deg,#f5f2ff,#fff8ed);
color:#302a45;
}

header{
background:white;
padding:16px 24px;
display:flex;
align-items:center;
gap:18px;
box-shadow:0 3px 15px #0001;
position:sticky;
top:0;
z-index:10;
}

.logo{
font-weight:900;
font-size:22px;
color:#6547e8;
}

.progress{
height:10px;
background:#ebe8f7;
border-radius:20px;
overflow:hidden;
flex:1;
}

.bar{
height:100%;
width:0%;
background:#6547e8;
transition:.3s;
}

.score{
font-weight:900;
color:#6547e8;
}

main{
max-width:1100px;
margin:auto;
padding:25px 18px 40px;
}

.title{
text-align:center;
margin-bottom:20px;
}

h1{
margin:0;
font-size:clamp(28px,5vw,40px);
color:#4a398d;
}

.subtitle{
margin-top:8px;
color:#756d80;
}

.instructions{
background:white;
border-radius:18px;
padding:16px;
text-align:center;
line-height:1.8;
box-shadow:0 5px 18px #0001;
margin-bottom:20px;
}

.instructions b{
color:#6547e8;
}

.board{
background:#ffffffdf;
border-radius:26px;
padding:20px;
box-shadow:0 10px 30px #0002;
}

.steps{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
}

.slot{
min-height:310px;
border:3px dashed #cfc9df;
border-radius:20px;
background:#faf9ff;
padding:12px;
transition:.2s;
cursor:pointer;
}

.slot:hover{
border-color:#8d7be8;
background:#f4f1ff;
}

.slot.correct{
border-color:#39b66c;
background:#edfff3;
}

.slot h2{
text-align:center;
font-size:18px;
color:#6547e8;
margin:3px 0 12px;
}

.dropzone{
min-height:245px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:9px;
}

.hint{
color:#aaa3b3;
font-size:14px;
text-align:center;
}

.placed-photo{
width:100%;
height:135px;
border-radius:12px;
overflow:hidden;
border:2px solid #39b66c;
background:white;
}

.placed-photo img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.placed-word{
width:100%;
padding:13px 6px;
border-radius:12px;
border:2px solid #39b66c;
background:#edfff3;
font-size:17px;
font-weight:900;
text-align:center;
}

.poolTitle{
text-align:center;
margin:25px 0 12px;
font-size:20px;
font-weight:900;
color:#4a398d;
}

.pool{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:13px;
}

.card{
background:white;
border:2px solid #e2deec;
border-radius:18px;
padding:10px;
cursor:pointer;
user-select:none;
box-shadow:0 4px 12px #0002;
transition:.18s;
}

.card:hover{
transform:translateY(-3px);
border-color:#9c8bf0;
}

.card.selected{
border-color:#6547e8;
background:#f0edff;
box-shadow:0 0 0 4px #6547e833;
transform:translateY(-3px);
}

.card.used{
opacity:.2;
pointer-events:none;
}

.pic{
height:120px;
overflow:hidden;
border-radius:12px;
background:#eee;
}

.pic img{
width:100%;
height:100%;
object-fit:cover;
}

.word{
font-size:17px;
font-weight:900;
text-align:center;
padding:13px 4px;
}

.message{
min-height:35px;
margin-top:18px;
text-align:center;
font-size:20px;
font-weight:900;
}

.success{
color:#178046;
}

.error{
color:#c43b3b;
}

.bottom{
text-align:center;
margin-top:18px;
}

button{
border:0;
background:#6547e8;
color:white;
border-radius:14px;
padding:11px 20px;
font-size:16px;
font-weight:900;
cursor:pointer;
}

.note{
font-size:12px;
color:#81788b;
text-align:center;
margin-top:12px;
}

@media(max-width:800px){

.steps{
grid-template-columns:repeat(2,1fr);
}

.pool{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:500px){

.steps{
grid-template-columns:1fr;
}

.pool{
grid-template-columns:repeat(2,1fr);
}

header{
flex-wrap:wrap;
}

.progress{
order:3;
flex-basis:100%;
}

}
</style>
</head>

<body>

<header>

<div class="logo">⚡ TOFU MATCH</div>

<div class="progress">
<div id="bar" class="bar"></div>
</div>

<div class="score">
⭐ <span id="score">0</span>/8
</div>

</header>

<main>

<div class="title">

<h1>🥣 豆腐制作四步骤</h1>

<div class="subtitle">
真实照片版 · 点击放入！
</div>

</div>

<div class="instructions">

<b>🎮 怎么玩？</b>

<br>

🖼️ <b>先点击照片</b> → 再点击正确的步骤格

<br>

📝 <b>再点击词语</b> → 再点击同一个步骤格

<br>

⬇️ 词语会自动出现在照片下面

<br>

❌ 完全不需要拖动！

</div>

<div class="board">

<div id="steps" class="steps"></div>

<div class="poolTitle">
🖼️ 点击选择照片
</div>

<div id="photoPool" class="pool"></div>

<div class="poolTitle">
📝 点击选择词语
</div>

<div id="wordPool" class="pool"></div>

<div id="message" class="message"></div>

<div class="bottom">

<button onclick="resetGame()">
🔄 重新开始
</button>

</div>

<div class="note">
照片来自公开网页资料；游戏需要联网才能显示网上照片。
</div>

</div>

</main>

<script>

/* =========================
   豆腐四步骤资料
========================= */

const data = [

{
id:"s1",
title:"第 1 步",
word:"浸泡黄豆",
img:"https://i0.wp.com/simpleveganizer.com/wp-content/uploads/2023/04/Soaking-the-soybeans-after.jpg?ssl=1&w=1440"
},

{
id:"s2",
title:"第 2 步",
word:"磨成豆浆",
img:"https://pic5.40017.cn/01/001/34/53/rBLkBls0yeuAPmAnAALIs8JoTEk670_680x_00.jpg"
},

{
id:"s3",
title:"第 3 步",
word:"煮沸过滤",
img:"https://cdn.shopify.com/s/files/1/0234/7849/files/IMG_9588.jpg?v=1509292258"
},

{
id:"s4",
title:"第 4 步",
word:"凝固压制",
img:"https://tokyo-kitchen.icook.network/uploads/step/cover/245410/ea84e2e846ae3d55.jpg"
}

];


/* =========================
   游戏状态
========================= */

let score = 0;

let selectedPhoto = null;

let selectedWord = null;

let photoPlaced = {};

let wordPlaced = {};


/* =========================
   随机排序
========================= */

function shuffle(array){

return [...array].sort(
() => Math.random() - 0.5
);

}


/* =========================
   建立游戏画面
========================= */

function render(){

const steps =
document.getElementById("steps");

const photoPool =
document.getElementById("photoPool");

const wordPool =
document.getElementById("wordPool");

steps.innerHTML = "";

photoPool.innerHTML = "";

wordPool.innerHTML = "";


/* 建立上方四个格子 */

data.forEach(item => {

const slot =
document.createElement("div");

slot.className = "slot";

slot.id = item.id;

slot.innerHTML = `

<h2>${item.title}</h2>

<div class="dropzone">

<div class="hint">

先点击下面的照片<br>
然后点击这里

</div>

</div>

`;


/*
点击上方格子
*/

slot.addEventListener(
"click",
function(){

clickSlot(item.id);

}
);

steps.appendChild(slot);

});


/* =========================
   建立照片
========================= */

shuffle(data).forEach(item => {

const card =
document.createElement("div");

card.className = "card";

card.dataset.id = item.id;

card.innerHTML = `

<div class="pic">

<img
src="${item.img}"
alt="${item.word}"
>

</div>

`;


/*
点击照片
*/

card.addEventListener(
"click",
function(event){

event.stopPropagation();

selectPhoto(item.id,card);

}
);

photoPool.appendChild(card);

});


/* =========================
   建立词语
========================= */

shuffle(data).forEach(item => {

const card =
document.createElement("div");

card.className = "card";

card.dataset.id = item.id;

card.innerHTML = `

<div class="word">
${item.word}
</div>

`;


/*
点击词语
*/

card.addEventListener(
"click",
function(event){

event.stopPropagation();

selectWord(item.id,card);

}
);

wordPool.appendChild(card);

});


updateProgress();

}


/* =========================
   选择照片
========================= */

function selectPhoto(id,card){

/*
如果照片已经放进去
就不能再次选择
*/

if(photoPlaced[id]){
return;
}

selectedPhoto = id;


/* 清除其他选择 */

document
.querySelectorAll("#photoPool .card")
.forEach(card => {

card.classList.remove("selected");

});


/* 当前照片高亮 */

card.classList.add("selected");


showMessage(
"🖼️ 已选择照片！现在点击正确的步骤。",
false
);

}


/* =========================
   选择词语
========================= */

function selectWord(id,card){

if(wordPlaced[id]){
return;
}

selectedWord = id;


/* 清除其他词语选择 */

document
.querySelectorAll("#wordPool .card")
.forEach(card => {

card.classList.remove("selected");

});


/* 当前词语高亮 */

card.classList.add("selected");


showMessage(
"📝 已选择词语！现在点击正确的步骤。",
false
);

}


/* =========================
   点击上方步骤格
========================= */

function clickSlot(slotId){

/*
如果什么都没有选择
*/

if(
selectedPhoto === null &&
selectedWord === null
){

showMessage(
"👆 请先点击照片或词语！",
true
);

return;

}


/* =========================
   放入照片
========================= */

if(selectedPhoto !== null){

/*
点击错误位置
*/

if(selectedPhoto !== slotId){

showMessage(
"❌ 照片位置不正确，请再试一次！",
true
);

return;

}


/*
这个位置已经有照片
*/

if(photoPlaced[slotId]){

showMessage(
"⚠️ 这个步骤已经有照片了。",
true
);

selectedPhoto = null;

return;

}


const item =
data.find(x => x.id === slotId);


/* 记录照片 */

photoPlaced[slotId] = true;


/* 找到格子 */

const slot =
document.getElementById(slotId);

const zone =
slot.querySelector(".dropzone");


/* 删除提示 */

const hint =
zone.querySelector(".hint");

if(hint){
hint.remove();
}


/* 创建照片 */

const photo =
document.createElement("div");

photo.className =
"placed-photo";

photo.innerHTML = `

<img
src="${item.img}"
alt="${item.word}"
>

`;


/*
加入格子
*/

zone.appendChild(photo);


/* 原照片变暗 */

document
.querySelectorAll("#photoPool .card")
.forEach(card => {

if(card.dataset.id === slotId){

card.classList.remove("selected");

card.classList.add("used");

}

});


/* 清除选择 */

selectedPhoto = null;


/* 加分 */

score++;


/* 变绿色 */

slot.classList.add("correct");


showMessage(
"🎉 照片已经放进去！现在放对应的词语。",
false
);

updateProgress();

return;

}


/* =========================
   放入词语
========================= */

if(selectedWord !== null){

/*
点击错误位置
*/

if(selectedWord !== slotId){

showMessage(
"❌ 词语位置不正确，请再试一次！",
true
);

return;

}


/*
这个位置已经有词语
*/

if(wordPlaced[slotId]){

showMessage(
"⚠️ 这个步骤已经有词语了。",
true
);

selectedWord = null;

return;

}


const item =
data.find(x => x.id === slotId);


/* 记录词语 */

wordPlaced[slotId] = true;


/* 找到格子 */

const slot =
document.getElementById(slotId);

const zone =
slot.querySelector(".dropzone");


/*
删除提示
*/

const hint =
zone.querySelector(".hint");

if(hint){
hint.remove();
}


/*
创建词语
*/

const word =
document.createElement("div");

word.className =
"placed-word";

word.textContent =
item.word;


/*
非常重要：

这里把词语直接放到
dropzone里面。

dropzone使用flex column，
所以一定在照片下面。
*/

zone.appendChild(word);


/* 原词语变暗 */

document
.querySelectorAll("#wordPool .card")
.forEach(card => {

if(card.dataset.id === slotId){

card.classList.remove("selected");

card.classList.add("used");

}

});


/* 清除选择 */

selectedWord = null;


/* 加分 */

score++;


/* 格子绿色 */

slot.classList.add("correct");


showMessage(
"🎉 词语已经放到照片下面！",
false
);

updateProgress();


/*
检查是否8/8
*/

if(score === 8){

setTimeout(() => {

showMessage(
"🏆 恭喜！4个步骤全部完成！🎊",
false
);

},300);

}

}

}


/* =========================
   显示提示
========================= */

function showMessage(text,error){

const message =
document.getElementById("message");

message.textContent = text;

if(error){

message.className =
"message error";

}else{

message.className =
"message success";

}

}


/* =========================
   更新进度
========================= */

function updateProgress(){

document.getElementById("score")
.textContent = score;

document.getElementById("bar")
.style.width =
(score / 8 * 100) + "%";

}


/* =========================
   重新开始
========================= */

function resetGame(){

score = 0;

selectedPhoto = null;

selectedWord = null;

photoPlaced = {};

wordPlaced = {};

document.getElementById("message")
.textContent = "";

render();

}


/* =========================
   开始游戏
========================= */

render();

</script>

</body>
</html>
