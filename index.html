<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>豆腐制作四步骤｜真实照片拖拽游戏</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f5f2ff,#fff8ed);color:#302a45}
header{background:#fff;padding:16px 24px;display:flex;align-items:center;gap:18px;box-shadow:0 3px 15px #0001;position:sticky;top:0;z-index:5}
.logo{font-weight:900;color:#6547e8;font-size:22px;white-space:nowrap}.progress{height:10px;background:#ebe8f7;border-radius:20px;overflow:hidden;flex:1}.bar{height:100%;width:0;background:#6547e8;transition:.3s}.score{font-weight:900;color:#6547e8;white-space:nowrap}
main{max-width:1100px;margin:auto;padding:24px 18px 40px}.title{text-align:center;margin-bottom:18px}h1{margin:0;color:#4a398d;font-size:clamp(27px,5vw,40px)}.subtitle{color:#756d80;margin-top:7px}
.instructions{background:#fff;border-radius:18px;padding:14px;text-align:center;box-shadow:0 5px 18px #0001;margin-bottom:18px}.instructions b{color:#6547e8}
.board{background:#ffffffdf;border-radius:26px;padding:20px;box-shadow:0 10px 30px #0002}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.slot{min-height:245px;border:3px dashed #cfc9df;border-radius:20px;background:#faf9ff;padding:12px;transition:.2s}.slot.over{border-color:#6547e8;background:#f2efff;transform:translateY(-2px)}
.slot h2{text-align:center;font-size:18px;color:#6547e8;margin:3px 0 10px}.dropzone{min-height:190px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center}.hint{color:#aaa3b3;text-align:center;font-size:14px}
.placed{width:100%;padding:7px;border-radius:12px;background:#fff;border:2px solid #e7e2f0;text-align:center;font-weight:800}.placed.photo{height:115px;overflow:hidden;padding:0}.placed.photo img{width:100%;height:100%;object-fit:cover;border-radius:10px}.placed.word{font-size:17px}.placed.good{border-color:#39b66c;background:#edfff3}
.poolTitle{text-align:center;margin:24px 0 12px;color:#4a398d;font-size:20px;font-weight:900}.pool{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.wordTitle{margin-top:20px}.wordTitle+.pool .card{min-height:58px;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:2px solid #e2deec;border-radius:18px;padding:10px;cursor:grab;user-select:none;box-shadow:0 4px 12px #0002;transition:.18s;touch-action:none;-webkit-user-select:none;-webkit-touch-callout:none}.card:hover{transform:translateY(-3px);border-color:#9c8bf0}.card:active{cursor:grabbing}.card.used{opacity:.22;pointer-events:none}
.pic{height:120px;overflow:hidden;border-radius:12px;background:#eee}.pic img{width:100%;height:100%;object-fit:cover}.word{font-weight:900;text-align:center;padding:9px 4px;font-size:17px}
.bottom{text-align:center;margin-top:18px}button{border:0;background:#6547e8;color:#fff;border-radius:14px;padding:11px 18px;font-weight:900;cursor:pointer}.message{min-height:30px;text-align:center;font-size:20px;font-weight:900;margin-top:14px}.success{color:#178046}.error{color:#c43b3b}
.note{font-size:12px;color:#81788b;text-align:center;margin-top:12px}
@media(max-width:800px){.steps{grid-template-columns:repeat(2,1fr)}.pool{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.steps{grid-template-columns:1fr}.pool{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}.progress{order:3;flex-basis:100%}}
</style>
</head>
<body>
<header><div class="logo">⚡ TOFU MATCH</div><div class="progress"><div id="bar" class="bar"></div></div><div class="score">⭐ <span id="score">0</span>/8</div></header>
<main>
<div class="title"><h1>🥣 豆腐制作四步骤</h1><div class="subtitle">真实照片版 · 拖一拖・配一配！</div></div>
<div class="instructions"><b>玩法：</b>上方是空白步骤区。把下方<strong>打乱的真实照片和词语</strong>拖到正确步骤。<br><span style="font-size:14px;color:#756d80">📱 手机：按住图片或词语，拖到上方正确步骤后松手；电脑：直接拖动。</span>每一步要配好 <strong>1张照片＋1个词语</strong>。✨</div>
<div class="board">
<div id="steps" class="steps"></div>
<div class="poolTitle">⬇️ 打乱的图片</div>
<div id="photoPool" class="pool"></div>
<div class="poolTitle wordTitle">⬇️ 打乱的词语</div>
<div id="wordPool" class="pool"></div>
<div id="message" class="message"></div>
<div class="bottom"><button onclick="resetGame()">🔄 重新打乱</button></div>
<div class="note">照片来自公开网页资料；游戏需要联网才能显示网上照片。</div>
</div>
</main>
<script>
const data=[
{id:"s1",title:"第 1 步",word:"浸泡黄豆",img:"https://i0.wp.com/simpleveganizer.com/wp-content/uploads/2023/04/Soaking-the-soybeans-after.jpg?ssl=1&w=1440"},
{id:"s2",title:"第 2 步",word:"磨成豆浆",img:"https://pic5.40017.cn/01/001/34/53/rBLkBls0yeuAPmAnAALIs8JoTEk670_680x_00.jpg"},
{id:"s3",title:"第 3 步",word:"煮沸过滤",img:"https://cdn.shopify.com/s/files/1/0234/7849/files/IMG_9588.jpg?v=1509292258"},
{id:"s4",title:"第 4 步",word:"凝固压制",img:"https://tokyo-kitchen.icook.network/uploads/step/cover/245410/ea84e2e846ae3d55.jpg"}
];
let score=0;
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function resetGame(){
 score=0;document.getElementById("score").textContent=0;document.getElementById("bar").style.width="0%";document.getElementById("message").textContent="";
 const steps=document.getElementById("steps"),photoPool=document.getElementById("photoPool"),wordPool=document.getElementById("wordPool");
 steps.innerHTML="";photoPool.innerHTML="";wordPool.innerHTML="";
 data.forEach(s=>{
  const slot=document.createElement("div");slot.className="slot";slot.dataset.step=s.id;
  slot.innerHTML=`<h2>${s.title}</h2><div class="dropzone"><div class="hint">把正确的<br>照片＋词语<br>拖到这里</div></div>`;
  slot.ondragover=e=>{e.preventDefault();slot.classList.add("over")};slot.ondragleave=()=>slot.classList.remove("over");
  slot.ondrop=e=>{e.preventDefault();slot.classList.remove("over");dropItem(e.dataTransfer.getData("id"),e.dataTransfer.getData("type"),slot)};
  steps.appendChild(slot);
 });
 function addCard(c, target){
  const card=document.createElement("div");card.className="card";card.dataset.id=c.id;card.dataset.type=c.type;
  card.innerHTML=c.type==="photo"
    ? `<div class="pic"><img src="${c.text}" alt="豆腐制作真实照片"></div>`
    : `<div class="word">${c.text}</div>`;

  // 手机 + 电脑统一使用 Pointer Events 拖拽，避免手机无法放入上方步骤区。
  card.style.touchAction="none";
  let dragging=false, clone=null, startX=0, startY=0;

  function getSlotAt(x,y){
    const slots=[...document.querySelectorAll(".slot")];
    let best=null, bestDist=Infinity;
    for(const slot of slots){
      const r=slot.getBoundingClientRect();
      const inside=x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
      if(inside) return slot;
      const cx=Math.max(r.left,Math.min(x,r.right));
      const cy=Math.max(r.top,Math.min(y,r.bottom));
      const d=(x-cx)**2+(y-cy)**2;
      if(d<bestDist){bestDist=d;best=slot;}
    }
    // 放在步骤卡片附近即可吸附，减少手机拖放困难
    return Math.sqrt(bestDist)<55 ? best : null;
  }

  function startDrag(e){
    if(card.classList.contains("used")) return;
    dragging=true; startX=e.clientX; startY=e.clientY;
    card.setPointerCapture?.(e.pointerId);
    card.style.opacity=".35";
    clone=card.cloneNode(true);
    clone.className="card touch-drag-clone";
    const w=Math.min(card.getBoundingClientRect().width,230);
    clone.style.cssText=`position:fixed;left:${e.clientX-w/2}px;top:${e.clientY-60}px;width:${w}px;z-index:99999;pointer-events:none;opacity:.94;transform:scale(1.03);margin:0;`;
    document.body.appendChild(clone);
    e.preventDefault();
  }
  function moveDrag(e){
    if(!dragging) return;
    clone.style.left=(e.clientX-clone.offsetWidth/2)+"px";
    clone.style.top=(e.clientY-clone.offsetHeight/2)+"px";
    document.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));
    const slot=getSlotAt(e.clientX,e.clientY);
    if(slot) slot.classList.add("over");
    e.preventDefault();
  }
  function endDrag(e){
    if(!dragging) return;
    const slot=getSlotAt(e.clientX,e.clientY);
    document.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));
    if(slot) dropItem(c.id,c.type,slot);
    if(clone) clone.remove();
    clone=null;dragging=false;
    if(!card.classList.contains("used")) card.style.opacity="";
    e.preventDefault();
  }
  card.addEventListener("pointerdown",startDrag,{passive:false});
  card.addEventListener("pointermove",moveDrag,{passive:false});
  card.addEventListener("pointerup",endDrag,{passive:false});
  card.addEventListener("pointercancel",endDrag,{passive:false});
  card.addEventListener("dragstart",e=>e.preventDefault());
  target.appendChild(card);
}
shuffle(data.map(s=>({id:s.id,type:"photo",text:s.img}))).forEach(c=>addCard(c,photoPool));
shuffle(data.map(s=>({id:s.id,type:"word",text:s.word}))).forEach(c=>addCard(c,wordPool));
}
function dropItem(id,type,slot){
 const card=[...document.querySelectorAll(".card")].find(c=>c.dataset.id===id&&c.dataset.type===type&&!c.classList.contains("used"));if(!card)return;
 if(slot.dataset.step!==id){show("❌ 不是这个步骤，再试试看！","error");return}
 if(slot.querySelector(`.placed[data-type="${type}"]`)){show("ℹ️ 这个步骤已经放了同类型内容。","error");return}
 const s=data.find(x=>x.id===id),dz=slot.querySelector(".dropzone");dz.querySelector(".hint")?.remove();
 const p=document.createElement("div");p.dataset.type=type;p.className="placed "+(type==="photo"?"photo":"word")+" good";
 p.innerHTML=type==="photo"?`<img src="${s.img}" alt="真实照片">`:s.word;dz.appendChild(p);card.classList.add("used");
 score++;document.getElementById("score").textContent=score;document.getElementById("bar").style.width=(score/8*100)+"%";show("✅ 配对正确！","success");
 if(score===8)show("🎉 全部完成！你把四个步骤都排对了！","success");
}
function show(t,c){const m=document.getElementById("message");m.textContent=t;m.className="message "+c}
resetGame();
</script>
</body>
</html>
