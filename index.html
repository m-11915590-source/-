<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>豆腐制作四步骤｜点击配对游戏</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,"Microsoft YaHei",sans-serif;
background:linear-gradient(135deg,#f5f2ff,#fff8ed);
color:#302a45
}

header{
background:#fff;
padding:16px 24px;
display:flex;
align-items:center;
gap:18px;
box-shadow:0 3px 15px #0001;
position:sticky;
top:0;
z-index:5
}

.logo{
font-weight:900;
color:#6547e8;
font-size:22px;
white-space:nowrap
}

.progress{
height:10px;
background:#ebe8f7;
border-radius:20px;
overflow:hidden;
flex:1
}

.bar{
height:100%;
width:0;
background:#6547e8;
transition:.3s
}

.score{
font-weight:900;
color:#6547e8;
white-space:nowrap
}

main{
max-width:1100px;
margin:auto;
padding:24px 18px 40px
}

.title{
text-align:center;
margin-bottom:18px
}

h1{
margin:0;
color:#4a398d;
font-size:clamp(27px,5vw,40px)
}

.subtitle{
color:#756d80;
margin-top:7px
}

.instructions{
background:#fff;
border-radius:18px;
padding:16px;
text-align:center;
box-shadow:0 5px 18px #0001;
margin-bottom:18px;
line-height:1.7
}

.instructions b{
color:#6547e8
}

.board{
background:#ffffffdf;
border-radius:26px;
padding:20px;
box-shadow:0 10px 30px #0002
}

.steps{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px
}

.slot{
min-height:245px;
border:3px dashed #cfc9df;
border-radius:20px;
background:#faf9ff;
padding:12px;
transition:.2s
}

.slot h2{
text-align:center;
font-size:18px;
color:#6547e8;
margin:3px 0 10px
}

.dropzone{
min-height:190px;
display:flex;
flex-direction:column;
gap:8px;
align-items:center;
justify-content:center
}

.hint{
color:#aaa3b3;
text-align:center;
font-size:14px
}

.placed{
width:100%;
padding:7px;
border-radius:12px;
background:#fff;
border:2px solid #e7e2f0;
text-align:center;
font-weight:800
}

.placed.photo{
height:115px;
overflow:hidden;
padding:0
}

.placed.photo img{
width:100%;
height:100%;
object-fit:cover;
border-radius:10px
}

.placed.word{
font-size:17px
}

.placed.good{
border-color:#39b66c;
background:#edfff3
}

.poolTitle{
text-align:center;
margin:24px 0 12px;
color:#4a398d;
font-size:20px;
font-weight:900
}

.pool{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:13px
}

.card{
background:#fff;
border:2px solid #e2deec;
border-radius:18px;
padding:10px;
cursor:pointer;
user-select:none;
box-shadow:0 4px 12px #0002;
transition:.18s
}

.card:hover{
transform:translateY(-3px);
border-color:#9c8bf0
}

.card.selected{
border-color:#6547e8;
background:#f0edff;
transform:translateY(-4px);
box-shadow:0 0 0 3px #6547e833
}

.card.used{
opacity:.25;
pointer-events:none
}

.pic{
height:120px;
overflow:hidden;
border-radius:12px;
background:#eee
}

.pic img{
width:100%;
height:100%;
object-fit:cover
}

.word{
font-weight:900;
text-align:center;
padding:9px 4px;
font-size:17px
}

.message{
min-height:35px;
text-align:center;
font-size:20px;
font-weight:900;
margin-top:18px
}

.success{
color:#178046
}

.error{
color:#c43b3b
}

.bottom{
text-align:center;
margin-top:18px
}

button{
border:0;
background:#6547e8;
color:#fff;
border-radius:14px;
padding:11px 18px;
font-weight:900;
cursor:pointer;
font-size:16px
}

.note{
font-size:12px;
color:#81788b;
text-align:center;
margin-top:12px
}

@media(max-width:800px){
.steps{
grid-template-columns:repeat(2,1fr)
}

.pool{
grid-template-columns:repeat(2,1fr)
}
}

@media(max-width:500px){
.steps{
grid-template-columns:1fr
}

.pool{
grid-template-columns:repeat(2,1fr)
}

header{
flex-wrap:wrap
}

.progress{
order:3;
flex-basis:100%
}
}
</style>
</head>

<body>

<header>
<div class="logo">⚡ TOFU MATCH</div>

<div class="progress">
<div id="bar" class="bar"></div>
</div>

<div class="score">
⭐ <span id="score">0</span>/8
</div>
</header>

<main>

<div class="title">
<h1>🥣 豆腐制作四步骤</h1>
<div class="subtitle">真实照片版 · 点击配一配！</div>
</div>

<div class="instructions">
<b>🎮 玩法：</b>
先点击一张图片，再点击一个词语。
<br>
如果图片和词语属于同一个步骤，就会自动配对成功！✨
<br>
<span style="font-size:14px;color:#756d80">
📱 手机也可以直接点击，不需要拖动。
</span>
</div>

<div class="board">

<div id="steps" class="steps"></div>

<div class="poolTitle">
🖼️ 点击选择图片
</div>

<div id="photoPool" class="pool"></div>

<div class="poolTitle">
📝 点击选择词语
</div>

<div id="wordPool" class="pool"></div>

<div id="message" class="message"></div>

<div class="bottom">
<button onclick="resetGame()">🔄 重新开始</button>
</div>

<div class="note">
照片来自公开网页资料；游戏需要联网才能显示网上照片。
</div>

</div>

</main>
